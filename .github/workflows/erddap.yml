name: Build and Push ERDDAP Sidecar

on:
  push:
    branches: [ dev-*, aps-dndlogdp ]
    paths:
      - 'code/apps/erddap/**'
  
  pull_request:
    branches: [main, dev-*]
    paths:
      - 'code/apps/erddap/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: erddap-sidecar

jobs:
  build-and-push-erddap-sidecar:
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: './code/apps/erddap'
      
    permissions:
        contents: read
        packages: write
        attestations: write
        id-token: write

    steps:
        - name: 'Checkout Main'
          uses: actions/checkout@v4

        - name: 'set env variables'
          run: |
            VER=$(cat VERSION)
            echo "IMAGE_TAG=$VER" >> $GITHUB_ENV
    
        - name: Set up QEMU
          uses: docker/setup-qemu-action@v2
          
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2
  
        - name: 'Login to GitHub Container Registry'
          uses: docker/login-action@v1
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{github.actor}}
            password: ${{secrets.GITHUB_TOKEN}}

        - name: Build and push multi-platform image
          uses: docker/build-push-action@v4
          with:
            context: code/apps/erddap/.
            push: true
            tags: |
              ghcr.io/noaa-pmel/msp/erddap-sidecar:${{env.IMAGE_TAG}}
              ghcr.io/noaa-pmel/msp/erddap-sidecar:latest
            platforms: linux/amd64,linux/arm64