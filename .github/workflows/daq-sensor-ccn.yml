name: Build and Push dmt-ccn

on:
  push:
    branches: [ 'dev-*', 'main' ]
    paths:
      - 'code/apps/daq/sensors/DMT/CCN/**'
  
  pull_request:
    branches: [ 'main', 'dev-*' ]
    paths:
      - 'code/apps/daq/sensors/DMT/CCN/**'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-dmt-ccn:
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: './code/apps/daq/sensors/DMT/CCN'
      
    permissions:
        contents: read
        packages: write
        attestations: write
        id-token: write

    steps:
        - name: 'Checkout Main'
          uses: actions/checkout@v4

        - name: 'set env variables'
          run: |
            VER=$(cat VERSION)
            echo "IMAGE_TAG=$VER" >> $GITHUB_ENV

        - name: Set up QEMU
          uses: docker/setup-qemu-action@v2
          
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2
  
        - name: 'Login to GitHub Container Registry'
          uses: docker/login-action@v1
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{github.actor}}
            password: ${{secrets.GITHUB_TOKEN}}

        # - name: Build and push CCN-100 multi-platform image
        #   uses: docker/build-push-action@v4
        #   with:
        #     context: code/apps/daq/sensors/DMT/CCN/.
        #     file: code/apps/daq/sensors/DMT/CCN/Dockerfile.ccn100
        #     push: true
        #     tags: |
        #       ghcr.io/noaa-pmel/msp/dmt-ccn100:${{env.IMAGE_TAG}}
        #     platforms: linux/amd64,linux/arm64

        - name: Build and push CCN-200 multi-platform image
          uses: docker/build-push-action@v4
          with:
            context: code/apps/daq/sensors/DMT/CCN/.
            file: code/apps/daq/sensors/DMT/CCN/Dockerfile.ccn200
            push: true
            tags: |
              ghcr.io/noaa-pmel/msp/dmt-ccn200:${{env.IMAGE_TAG}}
            platforms: linux/amd64,linux/arm64